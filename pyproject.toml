[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhe"
version = "0.5.0"
description = "Reproducible computational workflows for an EJP teaching article on the integer quantum Hall effect."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Gabriel W. C. Rocha" },
]
keywords = [
  "quantum Hall effect",
  "topological matter",
  "Berry curvature",
  "Chern number",
  "Harper-Hofstadter",
  "computational physics",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "sympy>=1.12",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]
notebooks = [
  "jupyterlab>=4",
  "ipykernel>=6",
  "nbformat>=5",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
all = [
  "qhe[dev,notebooks,docs]",
]

[project.urls]
Homepage = "https://github.com/REPLACE-WITH-ACCOUNT/qhe-ejp"
Repository = "https://github.com/REPLACE-WITH-ACCOUNT/qhe-ejp"
Issues = "https://github.com/REPLACE-WITH-ACCOUNT/qhe-ejp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["qhe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["qhe"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
