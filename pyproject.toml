[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhe"
version = "0.7.0"
description = "Reproducible computational workflows for an teaching paper on the integer quantum Hall effect."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gabriel W. C. Rocha" },
]
keywords = [
  "quantum Hall effect",
  "topological matter",
  "Berry curvature",
  "Chern number",
  "Harper-Hofstadter",
  "computational physics",
  "physics education",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pillow>=10",
  "sympy>=1.12",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
notebooks = [
  "jupyterlab>=4",
  "ipykernel>=6",
  "nbformat>=5",
  "nbclient>=0.10",
  "nbconvert>=7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
release = [
  "build>=1.2",
  "twine>=5",
]
all = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "jupyterlab>=4",
  "ipykernel>=6",
  "nbformat>=5",
  "nbclient>=0.10",
  "nbconvert>=7",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/GabrielWendell/iqhe"
Repository = "https://github.com/GabrielWendell/iqhe"
Issues = "https://github.com/GabrielWendell/iqhe/issues"
Changelog = "https://github.com/GabrielWendell/iqhe/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["legacy", "results/generated", "figures/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["qhe"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_main_figures.py" = ["E402"]
"scripts/make_stage6_figures.py" = ["E402"]
"scripts/run_stage1_checks.py" = ["E402"]
"scripts/run_stage2_checks.py" = ["E402"]
"scripts/run_stage3_checks.py" = ["E402"]
"scripts/run_stage6_checks.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["qhe"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
