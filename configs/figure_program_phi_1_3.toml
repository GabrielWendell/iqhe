[build]
context = "paper"
formats = ["pdf", "png"]
output_directory = "figures/generated/main"

[model]
name = "Harper-Hofstadter"
p = 1
q = 3
tx = 1.0
ty = 1.0
lattice_spacing = 1.0

[dirac]
v_fermi = 1.0
mass = 0.25
kmax = 1.2
n_line = 301
n_map = 151

[topology]
nkx = 41
nky = 41
band_index = 0
convergence_mesh_sizes = [21, 41, 81]

[ribbon]
lx = 48
nky = 181
edge_width = 4
edge_participation_threshold = 0.70
side_margin = 1.0e-3

[figure_program]
implemented = [
  "figure_01_conceptual_roadmap",
  "figure_02_fhs_plaquette",
  "figure_03_massive_dirac_warmup",
  "figure_04_hofstadter_bulk_bands",
  "figure_05_fhs_kubo_validation",
  "figure_06_ribbon_bulk_boundary",
]
stage_specific = [
  "figure_07_chiral_dynamics",
  "figure_08_velocity_and_defect",
]
reserved_for_later_stages = []

[dynamics]
gap_index = 0
side = "left"
lx = 12
ly = 30
edge_width = 2
sigma_transverse = 0.8
sigma_longitudinal = 5.0
center_longitudinal = 0.50
offset_from_boundary = 0.5
time_final = 4.0
n_times = 41
fit_until = 2.0
minimum_side_participation = 0.20
bulk_nkx = 15
ribbon_lx = 24
ribbon_nky = 81
ribbon_edge_threshold = 0.50
defect_factor = 0.0
hbar = 1.0
